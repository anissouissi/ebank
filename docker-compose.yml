services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak-db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Set KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Set KEYCLOAK_DB_USER in .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  ollama-model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b}"]
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    restart: "no"

  mcp:
    build:
      context: .
      dockerfile: src/Ebank.Mcp/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Keycloak__Authority: http://keycloak:8080/realms/ebank
      Keycloak__Issuer: http://localhost:8080/realms/ebank
      Keycloak__BackchannelAuthority: http://keycloak:8080/realms/ebank
      Keycloak__Audience: ebank-mcp
      Keycloak__RequireHttpsMetadata: "false"
      EbankApi__BaseUrl: http://host.docker.internal:5100
    ports:
      - "127.0.0.1:7101:8080"
    depends_on:
      keycloak:
        condition: service_started

  ebank-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ebank
      POSTGRES_USER: ${EBANK_DB_USER:?Set EBANK_DB_USER in .env}
      POSTGRES_PASSWORD: ${EBANK_DB_PASSWORD:?Set EBANK_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    volumes:
      - ebank-db:/var/lib/postgresql/data

volumes:
  keycloak-db:
  ebank-db:
  ollama-models:
